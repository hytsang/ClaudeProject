<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Connection Test</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #ddd; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    #log { background: #000; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .success { color: #4f4; }
    .error { color: #f44; }
    .info { color: #4af; }
    input { padding: 8px; margin: 5px; }
  </style>
</head>
<body>
  <h1>PeerJS Connection Test</h1>

  <div>
    <button onclick="createRoom()">Create Room</button>
    <input type="text" id="roomCode" placeholder="Room Code" maxlength="6">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <div id="log"></div>

<script>
let peer = null;
let conn = null;

function log(msg, type = 'info') {
  const div = document.getElementById('log');
  const line = document.createElement('div');
  line.className = type;
  line.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
  div.appendChild(line);
  div.scrollTop = div.scrollHeight;
  console.log(msg);
}

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

const PEER_CONFIG = {
  debug: 3,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' }
    ]
  }
};

function createRoom() {
  const roomCode = generateCode();
  log('Creating room: ' + roomCode, 'info');

  peer = new Peer(roomCode, PEER_CONFIG);

  peer.on('open', id => {
    log('SUCCESS: Room created with ID: ' + id, 'success');
    log('Share this code with the other player: ' + id, 'success');
    document.getElementById('roomCode').value = id;
  });

  peer.on('connection', connection => {
    log('SUCCESS: Someone is connecting!', 'success');
    conn = connection;
    setupConnection();
  });

  peer.on('error', err => {
    log('ERROR: ' + err.type + ' - ' + err.message, 'error');
  });

  peer.on('disconnected', () => {
    log('Disconnected from server', 'error');
  });
}

function joinRoom() {
  const roomCode = document.getElementById('roomCode').value.toUpperCase().trim();
  if (!roomCode) {
    log('Please enter a room code', 'error');
    return;
  }

  log('Joining room: ' + roomCode, 'info');

  peer = new Peer(PEER_CONFIG);

  peer.on('open', id => {
    log('Connected to PeerJS server with ID: ' + id, 'success');
    log('Connecting to room: ' + roomCode, 'info');

    conn = peer.connect(roomCode);
    setupConnection();
  });

  peer.on('error', err => {
    log('ERROR: ' + err.type + ' - ' + err.message, 'error');
  });
}

function setupConnection() {
  log('Setting up connection...', 'info');

  conn.on('open', () => {
    log('SUCCESS: Connection established!', 'success');
    conn.send({ type: 'hello', message: 'Connected!' });
  });

  conn.on('data', data => {
    log('Received: ' + JSON.stringify(data), 'success');
  });

  conn.on('close', () => {
    log('Connection closed', 'error');
  });

  conn.on('error', err => {
    log('Connection error: ' + err, 'error');
  });

  // Monitor ICE state
  conn.on('iceStateChanged', state => {
    log('ICE state: ' + state, state === 'connected' ? 'success' : 'info');
  });

  // Check connection state after 5 seconds
  setTimeout(() => {
    if (conn && conn.peerConnection) {
      const pc = conn.peerConnection;
      log('ICE Connection State: ' + pc.iceConnectionState, 'info');
      log('ICE Gathering State: ' + pc.iceGatheringState, 'info');
      log('Connection State: ' + pc.connectionState, 'info');
      log('Signaling State: ' + pc.signalingState, 'info');
    }
  }, 5000);
}
</script>
</body>
</html>
