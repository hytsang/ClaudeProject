<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Connection Test</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #ddd; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    #log { background: #000; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .success { color: #4f4; }
    .error { color: #f44; }
    .info { color: #4af; }
    input { padding: 8px; margin: 5px; }
  </style>
</head>
<body>
  <h1>PeerJS Connection Test</h1>

  <div>
    <button onclick="createRoom()">Create Room</button>
    <input type="text" id="roomCode" placeholder="Room Code" maxlength="6">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <div id="log"></div>

<script>
let peer = null;
let conn = null;

function log(msg, type = 'info') {
  const div = document.getElementById('log');
  const line = document.createElement('div');
  line.className = type;
  line.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
  div.appendChild(line);
  div.scrollTop = div.scrollHeight;
  console.log(msg);
}

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// Metered.ca free TURN servers (sign up at metered.ca for your own)
const PEER_CONFIG = {
  debug: 3,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun.relay.metered.ca:80' },
      {
        urls: 'turn:global.relay.metered.ca:80',
        username: 'c6c0d335cf4fae03f40deed6',
        credential: 'F8rE6ki3VEj3AGWX'
      },
      {
        urls: 'turn:global.relay.metered.ca:80?transport=tcp',
        username: 'c6c0d335cf4fae03f40deed6',
        credential: 'F8rE6ki3VEj3AGWX'
      },
      {
        urls: 'turn:global.relay.metered.ca:443',
        username: 'c6c0d335cf4fae03f40deed6',
        credential: 'F8rE6ki3VEj3AGWX'
      },
      {
        urls: 'turns:global.relay.metered.ca:443?transport=tcp',
        username: 'c6c0d335cf4fae03f40deed6',
        credential: 'F8rE6ki3VEj3AGWX'
      }
    ]
  }
};

// Test TURN connectivity on page load
async function testTurnServer() {
  log('Testing TURN server connectivity...', 'info');
  const pc = new RTCPeerConnection({ iceServers: PEER_CONFIG.config.iceServers });

  const candidates = { host: 0, srflx: 0, relay: 0 };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      candidates[e.candidate.type] = (candidates[e.candidate.type] || 0) + 1;
    }
  };

  pc.onicegatheringstatechange = () => {
    if (pc.iceGatheringState === 'complete') {
      log('TURN Test Results:', 'info');
      log('  host (local): ' + candidates.host, candidates.host > 0 ? 'success' : 'error');
      log('  srflx (STUN): ' + candidates.srflx, candidates.srflx > 0 ? 'success' : 'error');
      log('  relay (TURN): ' + candidates.relay, candidates.relay > 0 ? 'success' : 'error');
      if (candidates.relay === 0) {
        log('WARNING: No TURN relay candidates! Connection may fail.', 'error');
      }
      pc.close();
    }
  };

  // Create a data channel to trigger ICE gathering
  pc.createDataChannel('test');
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
}

// Run TURN test on page load
testTurnServer();

function createRoom() {
  const roomCode = generateCode();
  log('Creating room: ' + roomCode, 'info');

  peer = new Peer(roomCode, PEER_CONFIG);

  peer.on('open', id => {
    log('SUCCESS: Room created with ID: ' + id, 'success');
    log('Share this code with the other player: ' + id, 'success');
    document.getElementById('roomCode').value = id;
  });

  peer.on('connection', connection => {
    log('SUCCESS: Someone is connecting!', 'success');
    log('Connection object: ' + (connection ? 'exists' : 'null'), 'info');
    conn = connection;
    setupConnection();
  });

  peer.on('error', err => {
    log('ERROR: ' + err.type + ' - ' + err.message, 'error');
  });

  peer.on('disconnected', () => {
    log('Disconnected from server', 'error');
  });
}

function joinRoom() {
  const roomCode = document.getElementById('roomCode').value.toUpperCase().trim();
  if (!roomCode) {
    log('Please enter a room code', 'error');
    return;
  }

  log('Joining room: ' + roomCode, 'info');

  peer = new Peer(PEER_CONFIG);

  peer.on('open', id => {
    log('Connected to PeerJS server with ID: ' + id, 'success');
    log('Connecting to room: ' + roomCode, 'info');

    conn = peer.connect(roomCode);
    log('Connection object created: ' + (conn ? 'yes' : 'no'), 'info');
    setupConnection();
  });

  peer.on('error', err => {
    log('ERROR: ' + err.type + ' - ' + err.message, 'error');
  });
}

function setupConnection() {
  log('=== Setting up connection ===', 'info');
  log('conn exists: ' + !!conn, 'info');
  log('conn.open: ' + conn.open, 'info');
  log('conn.type: ' + conn.type, 'info');

  conn.on('open', () => {
    log('SUCCESS: Connection established!', 'success');
    conn.send({ type: 'hello', message: 'Connected!' });
  });

  conn.on('data', data => {
    log('Received: ' + JSON.stringify(data), 'success');
  });

  conn.on('close', () => {
    log('Connection closed', 'error');
  });

  conn.on('error', err => {
    log('Connection error: ' + err, 'error');
  });

  // Monitor ICE state
  conn.on('iceStateChanged', state => {
    log('ICE state changed: ' + state, state === 'connected' ? 'success' : 'info');
  });

  // Log ICE candidates to see what types we're getting
  setTimeout(() => {
    if (conn.peerConnection) {
      conn.peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          const c = event.candidate;
          const type = c.type || 'unknown';
          const protocol = c.protocol || '';
          log('ICE candidate: ' + type + ' ' + protocol + ' ' + (c.address || ''), 'info');
        } else {
          log('ICE gathering complete', 'success');
        }
      };
    }
  }, 100);

  // Check connection state every 2 seconds
  let checkCount = 0;
  const checkInterval = setInterval(() => {
    checkCount++;
    log('--- Check #' + checkCount + ' ---', 'info');
    log('conn.open: ' + conn.open, 'info');

    if (conn.peerConnection) {
      const pc = conn.peerConnection;
      log('ICE: ' + pc.iceConnectionState + ', Gathering: ' + pc.iceGatheringState, 'info');
      log('Connection: ' + pc.connectionState + ', Signaling: ' + pc.signalingState, 'info');

      if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
        log('ICE Connected!', 'success');
        clearInterval(checkInterval);
      }
      if (pc.iceConnectionState === 'failed') {
        log('ICE Failed!', 'error');
        clearInterval(checkInterval);
      }
    } else {
      log('peerConnection not yet created', 'info');
    }

    if (checkCount >= 10) {
      log('Stopping checks after 20 seconds', 'info');
      clearInterval(checkInterval);
    }
  }, 2000);
}
</script>
</body>
</html>
