<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go – 19×19</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e1e;
      color: #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }
    h1 { font-size: 1.4rem; color: #ccc; letter-spacing: 1px; }
    /* Access Gate */
    #access-gate {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #access-gate.hidden { display: none; }
    #access-gate h1 { margin-bottom: 24px; }
    #access-gate .gate-box {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      max-width: 320px;
    }
    #access-gate input {
      background: #1e1e1e;
      border: 1px solid #555;
      border-radius: 6px;
      color: #ddd;
      padding: 10px 14px;
      font-size: 1rem;
      width: 100%;
      margin-bottom: 12px;
    }
    #access-gate .error { color: #f55; font-size: 0.85rem; margin-bottom: 12px; min-height: 1.2em; }
    #game-content { display: none; }
    #game-content.visible { display: contents; }
    #info {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    #turn-display { font-size: 1.15rem; font-weight: bold; min-width: 200px; text-align: center; }
    .cap-box {
      background: #2e2e2e;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.9rem;
    }
    canvas { cursor: crosshair; display: block; max-width: 100%; }
    #controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button {
      background: #333;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 7px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #444; }
    button:disabled { opacity: 0.35; cursor: default; }
    #scoring-panel {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 14px 20px;
      text-align: center;
      max-width: 500px;
    }
    #scoring-panel p { color: #aaa; font-size: 0.88rem; margin-bottom: 10px; line-height: 1.5; }
    #scoring-panel .btns { display: flex; gap: 10px; justify-content: center; }
    #result {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 16px 24px;
      text-align: center;
      max-width: 520px;
    }
    #result h2 { font-size: 1.3rem; margin-bottom: 10px; color: #fff; }
    #result table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    #result td, #result th { padding: 5px 10px; border: 1px solid #444; text-align: center; }
    #result th { background: #333; }
    #msg {
      min-height: 1.2em;
      font-size: 0.85rem;
      color: #f80;
    }
    /* Lobby styles */
    #lobby {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    #lobby h2 { font-size: 1.1rem; margin-bottom: 16px; color: #ccc; }
    #lobby .btn-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
    #lobby input {
      background: #1e1e1e;
      border: 1px solid #555;
      border-radius: 6px;
      color: #ddd;
      padding: 8px 12px;
      font-size: 1rem;
      text-transform: uppercase;
      width: 120px;
      text-align: center;
      letter-spacing: 2px;
    }
    #lobby input::placeholder { text-transform: none; letter-spacing: normal; color: #666; }
    #join-form { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    #color-select { margin: 12px 0; }
    #color-select label { margin-right: 16px; cursor: pointer; }
    #room-info {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    #room-info .code {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #4a9;
      margin: 8px 0;
    }
    #room-info .share-url {
      font-size: 0.75rem;
      color: #888;
      word-break: break-all;
      margin: 8px 0;
    }
    #connection-status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #888;
    }
    #connection-status.connected { color: #4a9; }
    #connection-status.error { color: #f55; }
    /* Chat styles */
    #chat-panel {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 12px;
      width: 280px;
      max-height: 400px;
      display: flex;
      flex-direction: column;
    }
    #chat-panel h3 { font-size: 0.9rem; color: #888; margin-bottom: 8px; }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      background: #1e1e1e;
      border-radius: 6px;
      padding: 8px;
      min-height: 150px;
      max-height: 250px;
      font-size: 0.85rem;
    }
    #chat-messages .msg { margin-bottom: 6px; }
    #chat-messages .msg-black { color: #aaa; }
    #chat-messages .msg-white { color: #ddd; }
    #chat-messages .msg-system { color: #666; font-style: italic; }
    #chat-form { display: flex; gap: 6px; margin-top: 8px; }
    #chat-input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #555;
      border-radius: 6px;
      color: #ddd;
      padding: 6px 10px;
      font-size: 0.85rem;
    }
    #chat-form button { padding: 6px 12px; }
    /* Connection indicator */
    #conn-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      background: #666;
    }
    #conn-indicator.connected { background: #4a9; }
    #conn-indicator.connecting { background: #fa0; }
    #conn-indicator.disconnected { background: #f55; }
    /* Game container for side-by-side layout */
    #game-container {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }
    #game-main { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  </style>
</head>
<body>
  <!-- Access Gate -->
  <div id="access-gate">
    <h1>Go · 19×19</h1>
    <div class="gate-box">
      <p style="margin-bottom: 16px; color: #aaa;">Enter access code to play</p>
      <input type="password" id="access-code" placeholder="Access Code" autocomplete="off">
      <div class="error" id="gate-error"></div>
      <button id="gate-submit" style="width: 100%;">Enter</button>
    </div>
  </div>

  <!-- Game Content (hidden until authenticated) -->
  <div id="game-content">
  <h1>Go · 19×19</h1>

  <!-- Lobby UI -->
  <div id="lobby">
    <h2>Online Multiplayer</h2>
    <div class="btn-row">
      <button id="create-btn">Create Game</button>
      <button id="join-btn">Join Game</button>
      <button id="local-btn">Play Local</button>
    </div>
    <div id="color-select" style="display:none">
      <span>Play as: </span>
      <label><input type="radio" name="color" value="1" checked> ⚫ Black</label>
      <label><input type="radio" name="color" value="2"> ⚪ White</label>
      <br><br>
      <button id="create-confirm-btn">Create Room</button>
      <button id="create-cancel-btn">Cancel</button>
    </div>
    <div id="join-form" style="display:none">
      <input type="text" id="room-input" placeholder="Code" maxlength="6">
      <button id="connect-btn">Join</button>
      <button id="join-cancel-btn">Cancel</button>
    </div>
    <div id="room-info" style="display:none">
      <div>Room Code:</div>
      <div class="code" id="room-code"></div>
      <div class="share-url" id="share-url"></div>
      <button id="copy-btn">Copy Link</button>
    </div>
    <div id="connection-status"></div>
    <button id="retry-btn" style="display:none; margin-top: 12px;">Retry Connection</button>
  </div>

  <!-- Game UI (hidden until game starts) -->
  <div id="game-container" style="display:none">
    <div id="game-main">
      <div id="info">
        <span id="conn-indicator"></span>
        <div id="turn-display">⚫ Black's turn</div>
        <div class="cap-box">⚫ Captures: <span id="black-cap">0</span></div>
        <div class="cap-box">⚪ Captures: <span id="white-cap">0</span></div>
      </div>

      <canvas id="board"></canvas>
      <div id="msg"></div>

      <div id="controls">
        <button id="pass-btn">Pass</button>
        <button id="resign-btn">Resign</button>
        <button id="new-btn">New Game</button>
      </div>

      <div id="scoring-panel" style="display:none">
        <p>Both players passed. Click stones to mark them <b>dead</b> (whole group toggles).<br>
           Click <b>Count Score</b> when both agree on dead stones.</p>
        <div class="btns">
          <button id="score-btn">Count Score</button>
          <button id="resume-btn">Resume Play</button>
        </div>
      </div>

      <div id="result" style="display:none"></div>
    </div>

    <!-- Chat Panel (shown in online mode) -->
    <div id="chat-panel" style="display:none">
      <h3>Chat</h3>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Type a message..." maxlength="200">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
  </div><!-- end game-content -->

<script>
// ── Access Control ───────────────────────────────────────────────────────────
// SHA-256 hash of the access code
const ACCESS_HASH = 'fa6f11d177039863e5ebc7d721f74851b0cdcb2a1d33b6eef27ac64ec304471f';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkAccess() {
  // Check if already authenticated in this session
  if (sessionStorage.getItem('go_authenticated') === 'true') {
    grantAccess();
    return;
  }

  // Show gate
  document.getElementById('access-gate').classList.remove('hidden');
  document.getElementById('access-code').focus();
}

function grantAccess() {
  sessionStorage.setItem('go_authenticated', 'true');
  document.getElementById('access-gate').classList.add('hidden');
  document.getElementById('game-content').classList.add('visible');
  checkURLParams();
}

document.getElementById('gate-submit').addEventListener('click', async () => {
  const code = document.getElementById('access-code').value;
  const hash = await sha256(code);

  if (hash === ACCESS_HASH) {
    grantAccess();
  } else {
    document.getElementById('gate-error').textContent = 'Invalid access code';
    document.getElementById('access-code').value = '';
    document.getElementById('access-code').focus();
  }
});

document.getElementById('access-code').addEventListener('keypress', e => {
  if (e.key === 'Enter') {
    document.getElementById('gate-submit').click();
  }
});

// ── Game Constants ───────────────────────────────────────────────────────────
const SIZE  = 19;
const CELL  = 34;
const MAR   = 42;   // margin for coordinate labels
const COLS  = 'ABCDEFGHJKLMNOPQRST'; // 19 cols, skipping I
const HOSHI = [3, 9, 15];
const KOMI  = 6.5;
const CW    = MAR + (SIZE - 1) * CELL + MAR;

const canvas = document.getElementById('board');
const ctx    = canvas.getContext('2d');
canvas.width  = CW;
canvas.height = CW;

// ── State ────────────────────────────────────────────────────────────────────
let board, current, blackCap, whiteCap;
let prevBoard, passCount, phase, deadSet, lastMove;
let hover = null;
let tmap  = null;  // territory map (filled after score count)

// ── Networking State ─────────────────────────────────────────────────────────
let peer = null;           // PeerJS instance
let conn = null;           // DataConnection to opponent
let isHost = false;        // true if this player created the game
let myColor = 0;           // 1=black, 2=white (0 = local game)
let roomCode = null;       // Current room code
let connected = false;     // Connection status
let reconnectTimer = null; // For auto-reconnect
let chatHistory = [];      // Chat message history
let joinTimeout = null;    // Timeout for joining

// PeerJS configuration with ICE servers for NAT traversal
// Includes TURN servers for users behind strict NAT/firewalls
const PEER_CONFIG = {
  host: '0.peerjs.com',
  port: 443,
  secure: true,
  debug: 2,  // Verbose debugging
  config: {
    iceServers: [
      // STUN servers for NAT discovery
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      // TURN servers for relay (required for ~30% of users)
      {
        urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ]
  }
};

// ── Init ─────────────────────────────────────────────────────────────────────
function initGame() {
  board     = Array.from({length: SIZE}, () => new Int8Array(SIZE));
  current   = 1;
  blackCap  = 0;
  whiteCap  = 0;
  prevBoard = null;
  passCount = 0;
  phase     = 'play';
  deadSet   = new Set();
  lastMove  = null;
  tmap      = null;

  document.getElementById('scoring-panel').style.display = 'none';
  document.getElementById('result').style.display        = 'none';
  document.getElementById('pass-btn').disabled           = false;
  setMsg('');
  updateInfo();
  draw();
}

// ── Networking ───────────────────────────────────────────────────────────────
function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

function setConnectionStatus(msg, type = '') {
  const el = document.getElementById('connection-status');
  el.textContent = msg;
  el.className = type;
}

function updateConnIndicator(status) {
  const el = document.getElementById('conn-indicator');
  el.className = status; // 'connected', 'connecting', 'disconnected', or ''
}

function showLobby() {
  document.getElementById('lobby').style.display = 'block';
  document.getElementById('game-container').style.display = 'none';
  document.getElementById('chat-panel').style.display = 'none';
  resetLobbyUI();
}

function hideLobby() {
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game-container').style.display = 'flex';
  if (myColor !== 0) {
    document.getElementById('chat-panel').style.display = 'flex';
    updateConnIndicator(connected ? 'connected' : 'connecting');
  }
}

function resetLobbyUI() {
  document.querySelector('#lobby .btn-row').style.display = 'flex';
  document.getElementById('color-select').style.display = 'none';
  document.getElementById('join-form').style.display = 'none';
  document.getElementById('room-info').style.display = 'none';
  setConnectionStatus('');
}

function createGame(color) {
  roomCode = generateRoomCode();
  isHost = true;
  myColor = color;
  chatHistory = [];

  console.log('[Host] Creating peer with ID:', roomCode);
  peer = new Peer(roomCode, PEER_CONFIG);

  peer.on('open', id => {
    console.log('[Host] Peer opened with ID:', id);
    document.getElementById('room-code').textContent = id;
    const url = window.location.origin + window.location.pathname + '?room=' + id;
    document.getElementById('share-url').textContent = url;
    document.getElementById('room-info').style.display = 'block';
    setConnectionStatus('Waiting for opponent...', '');
  });

  peer.on('connection', conn => {
    console.log('[Host] Incoming connection from:', conn.peer);
    handleConnection(conn);
  });

  peer.on('error', err => {
    console.error('[Host] Peer error:', err.type, err);
    handlePeerError(err);
  });

  peer.on('disconnected', () => {
    console.log('[Host] Disconnected from server, reconnecting...');
    peer.reconnect();
  });
}

function joinGame(code) {
  roomCode = code.toUpperCase().trim();
  if (roomCode.length !== 6) {
    setConnectionStatus('Invalid room code', 'error');
    return;
  }
  isHost = false;
  chatHistory = [];

  // Clear any existing timeout
  if (joinTimeout) {
    clearTimeout(joinTimeout);
    joinTimeout = null;
  }

  console.log('[Guest] Creating peer to join room:', roomCode);
  peer = new Peer(PEER_CONFIG);

  peer.on('open', id => {
    console.log('[Guest] Peer opened with ID:', id);
    setConnectionStatus('Finding room...', '');
    console.log('[Guest] Connecting to room:', roomCode);
    conn = peer.connect(roomCode, { reliable: true });
    console.log('[Guest] Connection object created:', conn);
    setupConnection(conn);

    // Update status after signaling
    setTimeout(() => {
      if (!connected) {
        console.log('[Guest] Still not connected after 3s, waiting for ICE...');
        setConnectionStatus('Establishing connection...', '');
      }
    }, 3000);

    // Set timeout for connection (30 seconds to allow for TURN negotiation)
    joinTimeout = setTimeout(() => {
      if (!connected) {
        console.error('[Guest] Connection timed out after 30s');
        setConnectionStatus('Connection timed out. Check room code and try again.', 'error');
        showRetryButton();
      }
    }, 30000);
  });

  peer.on('error', err => {
    console.error('[Guest] Peer error:', err.type, err);
    handlePeerError(err);
  });

  peer.on('disconnected', () => {
    console.log('[Guest] Disconnected from server');
  });
}

function handleConnection(connection) {
  if (conn) {
    connection.close();
    return;
  }
  conn = connection;
  setupConnection(conn);
}

function setupConnection(connection) {
  console.log('[Setup] Setting up connection handlers');

  connection.on('open', () => {
    console.log('[Setup] Connection OPEN!');
    connected = true;
    if (reconnectTimer) {
      clearInterval(reconnectTimer);
      reconnectTimer = null;
    }
    if (joinTimeout) {
      clearTimeout(joinTimeout);
      joinTimeout = null;
    }
    hideRetryButton();
    setConnectionStatus('Connected!', 'connected');
    updateConnIndicator('connected');

    if (isHost) {
      sendMessage({ type: 'colorChoice', hostColor: myColor });
      initGame();
      sendState();
      hideLobby();
      addSystemMessage('Opponent connected');
    }
  });

  connection.on('data', data => {
    console.log('[Setup] Received data:', data.type);
    handleMessage(data);
  });

  connection.on('error', err => {
    console.error('[Setup] Connection error:', err);
  });

  // Monitor ICE connection state for debugging
  connection.on('iceStateChanged', state => {
    console.log('[Setup] ICE state changed:', state);
    if (state === 'disconnected' || state === 'failed') {
      setConnectionStatus('Connection unstable, reconnecting...', '');
    }
  });

  connection.on('close', () => {
    connected = false;
    updateConnIndicator('disconnected');
    addSystemMessage('Opponent disconnected');
    setMsg('Opponent disconnected. Waiting for reconnect...');

    if (!isHost && roomCode) {
      attemptReconnect();
    }
  });

  connection.on('error', err => {
    console.error('Connection error:', err);
  });
}

function attemptReconnect() {
  if (isHost || connected || reconnectTimer) return;

  reconnectTimer = setInterval(() => {
    if (connected) {
      clearInterval(reconnectTimer);
      reconnectTimer = null;
      return;
    }
    updateConnIndicator('connecting');
    conn = peer.connect(roomCode, { reliable: true });
    setupConnection(conn);
  }, 3000);
}

function handlePeerError(err) {
  console.error('Peer error:', err);

  // Clear timeout on error
  if (joinTimeout) {
    clearTimeout(joinTimeout);
    joinTimeout = null;
  }

  if (err.type === 'peer-unavailable') {
    setConnectionStatus('Room not found. Check the code and try again.', 'error');
    showRetryButton();
  } else if (err.type === 'unavailable-id') {
    setConnectionStatus('Room code in use. Creating new code...', 'error');
    roomCode = null;
    // Auto-retry with new code for host
    if (isHost) {
      setTimeout(() => createGame(myColor), 1000);
    }
  } else if (err.type === 'network') {
    setConnectionStatus('Network error. Check your internet connection.', 'error');
    showRetryButton();
  } else if (err.type === 'server-error') {
    setConnectionStatus('Server unavailable. Try again in a moment.', 'error');
    showRetryButton();
  } else if (err.type === 'disconnected') {
    setConnectionStatus('Disconnected from server. Reconnecting...', 'error');
    showRetryButton();
  } else {
    setConnectionStatus('Connection failed: ' + err.type, 'error');
    showRetryButton();
  }
}

function showRetryButton() {
  const retryBtn = document.getElementById('retry-btn');
  if (retryBtn) retryBtn.style.display = 'inline-block';
}

function hideRetryButton() {
  const retryBtn = document.getElementById('retry-btn');
  if (retryBtn) retryBtn.style.display = 'none';
}

function handleMessage(data) {
  switch (data.type) {
    case 'colorChoice':
      myColor = data.hostColor === 1 ? 2 : 1;
      initGame();
      hideLobby();
      addSystemMessage('Connected! You are ' + (myColor === 1 ? 'Black' : 'White'));
      break;

    case 'move':
      if (isHost) {
        if (current === 2 && placeStoneLocal(data.r, data.c)) {
          sendState();
        }
      } else {
        placeStoneLocal(data.r, data.c);
      }
      break;

    case 'pass':
      if (isHost) {
        if (current === 2) {
          doPassLocal();
          sendState();
        }
      } else {
        doPassLocal();
      }
      break;

    case 'state':
      applyState(data);
      break;

    case 'toggleDead':
      toggleDeadLocal(data.r, data.c);
      if (isHost) sendState();
      break;

    case 'countScore':
      calculateScoreLocal();
      if (isHost) sendState();
      break;

    case 'resumePlay':
      resumePlayLocal();
      if (isHost) sendState();
      break;

    case 'resign':
      handleRemoteResign(data.color);
      break;

    case 'chat':
      receiveChat(data.text, data.color);
      break;

    case 'newGame':
      if (!isHost) {
        initGame();
        addSystemMessage('Host started a new game');
      }
      break;
  }
}

function sendMessage(msg) {
  if (conn && connected) {
    conn.send(msg);
  }
}

function sendState() {
  if (!isHost) return;
  sendMessage({
    type: 'state',
    board: serializeBoard(board),
    current,
    blackCap,
    whiteCap,
    prevBoard: prevBoard ? serializeBoard(prevBoard) : null,
    passCount,
    phase,
    deadSet: Array.from(deadSet),
    lastMove
  });
}

function applyState(state) {
  board = deserializeBoard(state.board);
  current = state.current;
  blackCap = state.blackCap;
  whiteCap = state.whiteCap;
  prevBoard = state.prevBoard ? deserializeBoard(state.prevBoard) : null;
  passCount = state.passCount;
  phase = state.phase;
  deadSet = new Set(state.deadSet);
  lastMove = state.lastMove;
  tmap = null;

  document.getElementById('scoring-panel').style.display = phase === 'scoring' ? 'block' : 'none';
  document.getElementById('pass-btn').disabled = phase !== 'play';

  updateInfo();
  draw();
}

function serializeBoard(b) {
  return b.map(row => Array.from(row));
}

function deserializeBoard(data) {
  return data.map(row => new Int8Array(row));
}

function handleRemoteResign(resignColor) {
  const winner = resignColor === 1 ? '⚪ White' : '⚫ Black';
  const res = document.getElementById('result');
  res.style.display = 'block';
  res.innerHTML = `<h2>${winner} wins by resignation</h2>`;
  phase = 'done';
  updateInfo();
  addSystemMessage((resignColor === 1 ? 'Black' : 'White') + ' resigned');
}

// Local versions of game actions (no network send)
function placeStoneLocal(r, c) {
  if (phase !== 'play' || board[r][c] !== 0) return false;
  const opp = current === 1 ? 2 : 1;
  const nb  = copyBoard(board);
  nb[r][c]  = current;

  let captured = 0;
  for (const [nr, nc] of nbrs(r, c)) {
    if (nb[nr][nc] === opp) {
      const grp = getGroup(nr, nc, nb);
      if (!hasLiberty(grp, nb)) {
        for (const [gr, gc] of grp) { nb[gr][gc] = 0; captured++; }
      }
    }
  }

  if (!hasLiberty(getGroup(r, c, nb), nb)) { setMsg('Illegal move: suicide'); return false; }
  if (prevBoard && boardsEqual(nb, prevBoard)) { setMsg('Illegal move: ko'); return false; }

  prevBoard = copyBoard(board);
  board     = nb;
  if (current === 1) blackCap += captured;
  else               whiteCap += captured;

  lastMove  = [r, c];
  passCount = 0;
  current   = opp;
  setMsg('');
  updateInfo();
  draw();
  return true;
}

function doPassLocal() {
  if (phase !== 'play') return;
  prevBoard = null;
  lastMove  = null;
  passCount++;
  if (passCount >= 2) { enterScoring(); return; }
  current = current === 1 ? 2 : 1;
  setMsg((current === 1 ? 'White' : 'Black') + ' passed.');
  updateInfo();
  draw();
}

function toggleDeadLocal(r, c) {
  if (board[r][c] === 0) return;
  const grp  = getGroup(r, c, board);
  const key0 = grp[0][0] * SIZE + grp[0][1];
  const was   = deadSet.has(key0);
  for (const [gr, gc] of grp) {
    const k = gr * SIZE + gc;
    was ? deadSet.delete(k) : deadSet.add(k);
  }
  tmap = null;
  draw();
}

function calculateScoreLocal() {
  const { tmap: t, deadByColor, blackTerr, whiteTerr } = computeScore();
  tmap = t;

  const bScore = blackTerr + blackCap + deadByColor[2];
  const wScore = whiteTerr + whiteCap + deadByColor[1] + KOMI;

  const winner = bScore > wScore ? 'Black' : 'White';
  const margin = Math.abs(bScore - wScore).toFixed(1);

  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = `
    <h2>${winner === 'Black' ? '⚫' : '⚪'} ${winner} wins by ${margin} points</h2>
    <table>
      <tr><th></th><th>Territory</th><th>Captures</th><th>Dead opp.</th><th>Score</th></tr>
      <tr>
        <td>⚫ Black</td><td>${blackTerr}</td><td>${blackCap}</td><td>${deadByColor[2]}</td>
        <td><strong>${bScore}</strong></td>
      </tr>
      <tr>
        <td>⚪ White</td><td>${whiteTerr}</td><td>${whiteCap}</td><td>${deadByColor[1]}</td>
        <td><strong>${wScore.toFixed(1)}</strong> (incl. ${KOMI} komi)</td>
      </tr>
    </table>`;
  phase = 'done';
  draw();
}

function resumePlayLocal() {
  phase     = 'play';
  passCount = 0;
  deadSet   = new Set();
  tmap      = null;
  document.getElementById('scoring-panel').style.display = 'none';
  document.getElementById('result').style.display        = 'none';
  document.getElementById('pass-btn').disabled           = false;
  setMsg('');
  updateInfo();
  draw();
}

// Chat functions
function addSystemMessage(text) {
  chatHistory.push({ type: 'system', text });
  renderChat();
}

function sendChat(text) {
  if (!text.trim() || !connected) return;
  chatHistory.push({ type: myColor === 1 ? 'black' : 'white', text: text.trim() });
  renderChat();
  sendMessage({ type: 'chat', text: text.trim(), color: myColor });
}

function receiveChat(text, color) {
  chatHistory.push({ type: color === 1 ? 'black' : 'white', text });
  renderChat();
}

function renderChat() {
  const container = document.getElementById('chat-messages');
  container.innerHTML = chatHistory.map(msg => {
    const cls = msg.type === 'system' ? 'msg-system' : 'msg-' + msg.type;
    const prefix = msg.type === 'system' ? '' : (msg.type === 'black' ? '⚫ ' : '⚪ ');
    return `<div class="msg ${cls}">${prefix}${escapeHtml(msg.text)}</div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function nbrs(r, c) {
  const out = [];
  if (r > 0)       out.push([r-1, c]);
  if (r < SIZE-1)  out.push([r+1, c]);
  if (c > 0)       out.push([r, c-1]);
  if (c < SIZE-1)  out.push([r, c+1]);
  return out;
}

function getGroup(r, c, b) {
  const color = b[r][c];
  if (!color) return [];
  const vis = new Uint8Array(SIZE * SIZE);
  const stk = [r * SIZE + c];
  vis[r * SIZE + c] = 1;
  const result = [];
  while (stk.length) {
    const idx = stk.pop();
    result.push([Math.floor(idx / SIZE), idx % SIZE]);
    const cr = Math.floor(idx / SIZE), cc = idx % SIZE;
    for (const [nr, nc] of nbrs(cr, cc)) {
      const ni = nr * SIZE + nc;
      if (!vis[ni] && b[nr][nc] === color) { vis[ni] = 1; stk.push(ni); }
    }
  }
  return result;
}

function hasLiberty(group, b) {
  for (const [r, c] of group)
    for (const [nr, nc] of nbrs(r, c))
      if (b[nr][nc] === 0) return true;
  return false;
}

function copyBoard(b) { return b.map(row => row.slice()); }

function boardsEqual(a, b) {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (a[r][c] !== b[r][c]) return false;
  return true;
}

// ── Moves ────────────────────────────────────────────────────────────────────
function placeStone(r, c) {
  // In online mode, enforce turn
  if (myColor !== 0 && current !== myColor) {
    setMsg('Not your turn');
    return false;
  }

  if (phase !== 'play' || board[r][c] !== 0) return false;

  // In online mode as guest, send move request to host
  if (myColor !== 0 && !isHost) {
    sendMessage({ type: 'move', r, c });
    return true; // Optimistically return, host will sync state
  }

  // Execute move locally (local game or host)
  const result = placeStoneLocal(r, c);

  // If host, sync state to guest
  if (result && isHost && connected) {
    sendState();
  }

  return result;
}

function doPass() {
  if (phase !== 'play') return;

  // In online mode, enforce turn
  if (myColor !== 0 && current !== myColor) {
    setMsg('Not your turn');
    return;
  }

  // In online mode as guest, send pass request to host
  if (myColor !== 0 && !isHost) {
    sendMessage({ type: 'pass' });
    return;
  }

  // Execute pass locally (local game or host)
  doPassLocal();

  // If host, sync state to guest
  if (isHost && connected) {
    sendState();
  }
}

function enterScoring() {
  phase   = 'scoring';
  deadSet = new Set();
  tmap    = null;
  document.getElementById('scoring-panel').style.display = 'block';
  document.getElementById('pass-btn').disabled = true;
  setMsg('');
  updateInfo();
  draw();
}

// ── Dead stone toggle ────────────────────────────────────────────────────────
function toggleDead(r, c) {
  if (board[r][c] === 0) return;

  // Execute locally
  toggleDeadLocal(r, c);

  // Sync in online mode
  if (myColor !== 0 && connected) {
    sendMessage({ type: 'toggleDead', r, c });
    if (isHost) sendState();
  }
}

// ── Scoring ──────────────────────────────────────────────────────────────────
function computeScore() {
  const sb = copyBoard(board);
  const deadByColor = [0, 0, 0];

  for (const k of deadSet) {
    const r = Math.floor(k / SIZE), c = k % SIZE;
    deadByColor[sb[r][c]]++;
    sb[r][c] = 0;
  }

  const newTmap = Array.from({length: SIZE}, () => new Int8Array(SIZE));
  const visited = new Uint8Array(SIZE * SIZE);

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const idx = r * SIZE + c;
      if (sb[r][c] !== 0 || visited[idx]) continue;

      const region  = [];
      const borders = new Set();
      const stk     = [idx];
      const rv      = new Uint8Array(SIZE * SIZE);
      rv[idx]       = 1;

      while (stk.length) {
        const i  = stk.pop();
        const cr = Math.floor(i / SIZE), cc = i % SIZE;
        region.push([cr, cc]);
        visited[i] = 1;
        for (const [nr, nc] of nbrs(cr, cc)) {
          const ni = nr * SIZE + nc;
          if (sb[nr][nc] === 0) { if (!rv[ni]) { rv[ni] = 1; stk.push(ni); } }
          else borders.add(sb[nr][nc]);
        }
      }

      const owner = borders.size === 1 ? [...borders][0] : 0;
      for (const [tr, tc] of region) newTmap[tr][tc] = owner;
    }
  }

  let blackTerr = 0, whiteTerr = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (newTmap[r][c] === 1) blackTerr++;
      else if (newTmap[r][c] === 2) whiteTerr++;
    }

  return { tmap: newTmap, deadByColor, blackTerr, whiteTerr };
}

function calculateScore() {
  // In online mode as guest, send request to host
  if (myColor !== 0 && !isHost) {
    sendMessage({ type: 'countScore' });
    return;
  }

  // Execute locally (local game or host)
  calculateScoreLocal();

  // If host, sync state to guest
  if (isHost && connected) {
    sendState();
  }
}

// ── Coordinate helpers ───────────────────────────────────────────────────────
function boardXY(r, c) {
  return [MAR + c * CELL, MAR + r * CELL];
}

function screenToBoard(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  const sx   = canvas.width  / rect.width;
  const sy   = canvas.height / rect.height;
  const bx   = (cx - rect.left) * sx;
  const by   = (cy - rect.top)  * sy;
  const c    = Math.round((bx - MAR) / CELL);
  const r    = Math.round((by - MAR) / CELL);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return null;
  return [r, c];
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, CW, CW);

  // Board wood color
  ctx.fillStyle = '#c8a84b';
  ctx.fillRect(0, 0, CW, CW);

  // Subtle wood grain border shading
  const grad = ctx.createLinearGradient(0, 0, CW, CW);
  grad.addColorStop(0,   'rgba(255,220,120,0.18)');
  grad.addColorStop(0.5, 'rgba(0,0,0,0)');
  grad.addColorStop(1,   'rgba(0,0,0,0.12)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CW, CW);

  // Grid lines
  ctx.strokeStyle = '#7a5c1a';
  ctx.lineWidth   = 1;
  for (let i = 0; i < SIZE; i++) {
    const [x0] = boardXY(0, i);
    const [, y0] = boardXY(i, 0);
    const [xN] = boardXY(SIZE-1, i);
    const [, yN] = boardXY(i, SIZE-1);
    ctx.beginPath(); ctx.moveTo(x0, MAR); ctx.lineTo(xN, MAR + (SIZE-1)*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MAR, y0); ctx.lineTo(MAR + (SIZE-1)*CELL, yN); ctx.stroke();
  }

  // Correct: vertical lines (column = i, rows 0..SIZE-1)
  ctx.strokeStyle = '#7a5c1a';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    const x = MAR + i * CELL;
    ctx.beginPath(); ctx.moveTo(x, MAR); ctx.lineTo(x, MAR + (SIZE-1)*CELL); ctx.stroke();
  }
  for (let i = 0; i < SIZE; i++) {
    const y = MAR + i * CELL;
    ctx.beginPath(); ctx.moveTo(MAR, y); ctx.lineTo(MAR + (SIZE-1)*CELL, y); ctx.stroke();
  }

  // Star points (hoshi)
  ctx.fillStyle = '#5a3e0e';
  for (const r of HOSHI) for (const c of HOSHI) {
    const [x, y] = boardXY(r, c);
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // Coordinate labels
  ctx.fillStyle   = '#5a3e0e';
  ctx.font        = '11px monospace';
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < SIZE; i++) {
    const x = MAR + i * CELL;
    ctx.fillText(COLS[i], x, MAR / 2);
    ctx.fillText(COLS[i], x, CW - MAR / 2);
  }
  ctx.textAlign = 'right';
  for (let i = 0; i < SIZE; i++) {
    const y   = MAR + i * CELL;
    const num = SIZE - i;  // 19 at top, 1 at bottom (standard)
    ctx.fillText(num, MAR - 8, y);
    ctx.textAlign = 'left';
    ctx.fillText(num, CW - MAR + 8, y);
    ctx.textAlign = 'right';
  }

  // Territory overlay (shown after score count)
  if (tmap) {
    const sq = CELL * 0.32;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const owner = tmap[r][c];
      if (!owner || board[r][c] !== 0) continue;
      const [x, y] = boardXY(r, c);
      ctx.fillStyle = owner === 1 ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.7)';
      ctx.fillRect(x - sq/2, y - sq/2, sq, sq);
    }
  }

  // Stones
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (board[r][c]) {
      const isDead = deadSet.has(r * SIZE + c);
      drawStone(r, c, board[r][c], isDead ? 0.35 : 1.0);
    }
  }

  // Last move marker
  if (lastMove) {
    const [lr, lc] = lastMove;
    const [x, y]   = boardXY(lr, lc);
    ctx.strokeStyle = board[lr][lc] === 1 ? 'rgba(255,255,255,0.85)' : 'rgba(0,0,0,0.6)';
    ctx.lineWidth   = 2;
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.stroke();
  }

  // Hover ghost stone
  if (hover && phase === 'play') {
    const [r, c] = hover;
    if (board[r][c] === 0) drawStone(r, c, current, 0.38);
  }
}

function drawStone(r, c, color, alpha) {
  const [x, y] = boardXY(r, c);
  const rad    = CELL / 2 - 1.5;
  ctx.globalAlpha = alpha;

  const g = ctx.createRadialGradient(
    x - rad * 0.32, y - rad * 0.32, 0.5,
    x, y, rad
  );
  if (color === 1) {
    g.addColorStop(0, '#828282');
    g.addColorStop(1, '#0e0e0e');
  } else {
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#c2c2c2');
  }
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = color === 1 ? '#222' : '#999';
  ctx.lineWidth   = 0.8;
  ctx.stroke();

  ctx.globalAlpha = 1.0;
}

function updateInfo() {
  const el = document.getElementById('turn-display');
  if (phase === 'play') {
    if (myColor === 0) {
      // Local game
      el.textContent = current === 1 ? '⚫ Black\'s turn' : '⚪ White\'s turn';
    } else {
      // Online game
      const isMyTurn = current === myColor;
      const colorName = current === 1 ? 'Black' : 'White';
      const colorIcon = current === 1 ? '⚫' : '⚪';
      el.textContent = isMyTurn
        ? `${colorIcon} Your turn (${colorName})`
        : `${colorIcon} Opponent's turn (${colorName})`;
    }
  } else if (phase === 'scoring') {
    el.textContent = 'Scoring — mark dead stones';
  } else {
    el.textContent = 'Game over';
  }
  document.getElementById('black-cap').textContent = blackCap;
  document.getElementById('white-cap').textContent = whiteCap;
}

function setMsg(m) { document.getElementById('msg').textContent = m; }

// ── Events ────────────────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  const pos = screenToBoard(e.clientX, e.clientY);
  if (!pos) return;
  const [r, c] = pos;
  if (phase === 'play') placeStone(r, c);
  else if (phase === 'scoring') { toggleDead(r, c); }
});

canvas.addEventListener('mousemove', e => {
  hover = screenToBoard(e.clientX, e.clientY);
  if (phase === 'play') draw();
});

canvas.addEventListener('mouseleave', () => { hover = null; if (phase === 'play') draw(); });

document.getElementById('pass-btn').addEventListener('click', doPass);

document.getElementById('resign-btn').addEventListener('click', () => {
  if (phase !== 'play') return;

  // In online mode, enforce turn for resignation
  if (myColor !== 0 && current !== myColor) {
    setMsg('Not your turn to resign');
    return;
  }

  const resignColor = myColor !== 0 ? myColor : current;
  const winner = resignColor === 1 ? '⚪ White' : '⚫ Black';
  const res = document.getElementById('result');
  res.style.display = 'block';
  res.innerHTML = `<h2>${winner} wins by resignation</h2>`;
  phase = 'done';
  updateInfo();

  // Sync resignation in online mode
  if (myColor !== 0 && connected) {
    sendMessage({ type: 'resign', color: resignColor });
    addSystemMessage('You resigned');
  }
});

document.getElementById('new-btn').addEventListener('click', () => {
  if (myColor !== 0) {
    // Online mode - only host can start new game
    if (!isHost) {
      setMsg('Only host can start a new game');
      return;
    }
    initGame();
    sendMessage({ type: 'newGame' });
    sendState();
    addSystemMessage('New game started');
  } else {
    initGame();
  }
});

document.getElementById('score-btn').addEventListener('click', calculateScore);

document.getElementById('resume-btn').addEventListener('click', () => {
  // In online mode as guest, send request to host
  if (myColor !== 0 && !isHost) {
    sendMessage({ type: 'resumePlay' });
    return;
  }

  // Execute locally (local game or host)
  resumePlayLocal();

  // If host, sync state to guest
  if (isHost && connected) {
    sendState();
  }
});

// ── Lobby Events ─────────────────────────────────────────────────────────────
document.getElementById('create-btn').addEventListener('click', () => {
  document.querySelector('#lobby .btn-row').style.display = 'none';
  document.getElementById('color-select').style.display = 'block';
});

document.getElementById('create-cancel-btn').addEventListener('click', resetLobbyUI);

document.getElementById('create-confirm-btn').addEventListener('click', () => {
  const color = parseInt(document.querySelector('input[name="color"]:checked').value);
  document.getElementById('color-select').style.display = 'none';
  createGame(color);
});

document.getElementById('join-btn').addEventListener('click', () => {
  document.querySelector('#lobby .btn-row').style.display = 'none';
  document.getElementById('join-form').style.display = 'flex';
  document.getElementById('room-input').focus();
});

document.getElementById('join-cancel-btn').addEventListener('click', resetLobbyUI);

document.getElementById('connect-btn').addEventListener('click', () => {
  const code = document.getElementById('room-input').value;
  if (code) joinGame(code);
});

document.getElementById('room-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') {
    const code = document.getElementById('room-input').value;
    if (code) joinGame(code);
  }
});

document.getElementById('local-btn').addEventListener('click', () => {
  myColor = 0;
  isHost = false;
  connected = false;
  initGame();
  hideLobby();
  document.getElementById('chat-panel').style.display = 'none';
  updateConnIndicator('');
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const url = document.getElementById('share-url').textContent;
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById('copy-btn').textContent = 'Copied!';
    setTimeout(() => {
      document.getElementById('copy-btn').textContent = 'Copy Link';
    }, 2000);
  });
});

document.getElementById('retry-btn').addEventListener('click', () => {
  hideRetryButton();
  // Clean up existing peer
  if (peer) {
    peer.destroy();
    peer = null;
  }
  conn = null;
  connected = false;

  if (isHost) {
    createGame(myColor);
  } else if (roomCode) {
    joinGame(roomCode);
  } else {
    resetLobbyUI();
  }
});

// Chat form
document.getElementById('chat-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  sendChat(input.value);
  input.value = '';
});

// URL parameter handling
function checkURLParams() {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room) {
    document.getElementById('room-input').value = room;
    document.querySelector('#lobby .btn-row').style.display = 'none';
    document.getElementById('join-form').style.display = 'flex';
    joinGame(room);
  }
}

// Warn before leaving during active game
window.addEventListener('beforeunload', e => {
  if (connected && phase === 'play') {
    e.preventDefault();
    e.returnValue = 'Game in progress. Leave anyway?';
  }
});

// Initialize
checkAccess();
</script>
